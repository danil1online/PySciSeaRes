{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-box" style="max-width: 500px;">
        <h1>Регистрация</h1>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Логин (английские буквы, цифры, _)</label>
                <input type="text" id="username" name="username" required autofocus placeholder="min 3 символа" minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="мин 6 символов, буква и цифра" minlength="6">
            </div>
            <div class="form-group">
                <label for="password_confirm">Подтверждение пароля</label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="Повторите пароль">
            </div>
            <div class="form-group">
                <label for="cluster_id">Научный кластер</label>
                <select id="cluster_id" name="cluster_id" required>
                    <option value="">-- Выберите кластер --</option>
                    {% for cid, name in cluster_options %}
                    <option value="{{ cid }}">{{ cid }}. {{ name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>
        <p style="margin-top: 20px; text-align: center; color: #888;">
            Уже есть аккаунт? <a href="{{ url_for('login') }}" style="color: #00d4ff;">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
