{% extends "base.html" %}
{% block title %}Карта защит{% endblock %}
{% block content %}
<div class="map-page">
    <h1>Карта защит по городам</h1>

    <div class="map-controls">
        <div class="form-group">
            <label for="city-filter">Фильтр по городу:</label>
            <input type="text" id="city-filter" placeholder="Введите город...">
        </div>
        <div class="form-group">
            <label>Группировка по специальности:</label>
            <select id="specialty-filter">
                <option value="all">Все специальности</option>
            </select>
        </div>
    </div>

    <div id="map-container" style="height: 70vh; border-radius: 8px; overflow: hidden; margin-top: 16px;"></div>

    <div class="map-legend" id="map-legend">
        <h3>Легенда</h3>
        <p>Размер точки = количество защит</p>
        <p>Цвет точки = специальность</p>
        <div id="legend-colors"></div>
    </div>

    <div class="map-stats" id="map-stats">
        <p>Всего городов: <span id="total-cities">0</span></p>
        <p>Всего защит: <span id="total-defenses">0</span></p>
    </div>
</div>
{% endblock %}

function getCityCoords(city) {
    const lower = city.toLowerCase().trim();
    if (cityCoords[lower]) {
        return cityCoords[lower];
    }
    // Try without "г. " prefix
    const noPrefix = lower.replace(/^г\.\s*/, '');
    if (cityCoords[noPrefix]) {
        return cityCoords[noPrefix];
    }
    // Try partial match
    for (const [key, coords] of Object.entries(cityCoords)) {
        if (lower.includes(key) || key.includes(lower)) {
            return coords;
        }
    }
    // Default: Moscow
    return [55.7558, 37.6173];
}

function getSpecialtyColor(cipher) {
    if (!cipher) return "#999";
    const parts = cipher.split('.');
    const group = parts.length >= 2 ? parts[0] + '.' + parts[1] : parts[0];
    return specialtyColors[group] || specialtyColors[parts[0]] || "#999";
}

function initMap() {
    const map = L.map('map-container').setView([55.7558, 37.6173], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const filteredStats = cityStats.filter(s => {
        const cityFilter = document.getElementById('city-filter').value.toLowerCase();
        const specialtyFilter = document.getElementById('specialty-filter').value;

        if (cityFilter && !s.city.toLowerCase().includes(cityFilter)) {
            return false;
        }
        if (specialtyFilter !== 'all') {
            return s.specialties[specialtyFilter] > 0;
        }
        return true;
    });

    // Clear existing markers
    map.eachLayer(layer => {
        if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
            map.removeLayer(layer);
        }
    });

    filteredStats.forEach(stat => {
        const coords = getCityCoords(stat.city);
        if (!coords) return;

        const radius = Math.max(8, Math.min(30, Math.sqrt(stat.count) * 4));
        const primarySpecialty = Object.entries(stat.specialties)
            .sort((a, b) => b[1] - a[1])[0];
        const color = getSpecialtyColor(primarySpecialty[0]);

        const marker = L.circleMarker(coords, {
            radius: radius,
            fillColor: color,
            color: '#333',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.7
        }).addTo(map);

        const tooltip = `<strong>${stat.city}</strong><br>` +
            `Всего защит: ${stat.count}<br>` +
            `Основная специальность: ${primarySpecialty[0]}<br>` +
            `Специальности: ${Object.entries(stat.specialties).map(([s, c]) => `${s}: ${c}`).join(', ')}`;

        marker.bindTooltip(tooltip, { sticky: true });
        marker.bindPopup(`<strong>${stat.city}</strong><br>Защит: ${stat.count}<br>${Object.entries(stat.specialties).map(([s, c]) => `${s}: ${c} защит`).join('<br>')}`);
    });

    // Update stats
    document.getElementById('total-cities').textContent = filteredStats.length;
    document.getElementById('total-defenses').textContent = filteredStats.reduce((sum, s) => sum + s.count, 0);

    // Update legend
    const usedColors = new Set();
    filteredStats.forEach(s => {
        const primarySpecialty = Object.entries(s.specialties)
            .sort((a, b) => b[1] - a[1])[0];
        if (primarySpecialty) {
            usedColors.add(getSpecialtyColor(primarySpecialty[0]));
        }
    });

    const legendHtml = Array.from(usedColors).map(color =>
        `<div style="display: flex; align-items: center; gap: 8px; margin: 4px 0;">
            <div style="width: 16px; height: 16px; border-radius: 50%; background: ${color}; border: 1px solid #333;"></div>
            <span>Специальность</span>
        </div>`
    ).join('');
    document.getElementById('legend-colors').innerHTML = legendHtml;
}

document.getElementById('city-filter').addEventListener('input', initMap);
document.getElementById('specialty-filter').addEventListener('change', initMap);

// Populate specialty filter
const specialtyFilter = document.getElementById('specialty-filter');
specialtyGroups.forEach(group => {
    const option = document.createElement('option');
    option.value = group;
    option.textContent = group;
    specialtyFilter.appendChild(option);
});

initMap();
</script>
<style>
.map-page { max-width: 1200px; margin: 0 auto; }
.map-controls { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.map-controls .form-group { flex: 1; min-width: 200px; }
.map-controls input, .map-controls select {
    width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;
}
.map-legend {
    margin-top: 16px; padding: 16px; background: #f8f9fa; border-radius: 8px;
}
.map-legend h3 { margin-top: 0; }
.map-stats {
    margin-top: 16px; display: flex; gap: 32px;
}
.map-stats span { font-weight: bold; }
