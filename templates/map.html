{% extends "base.html" %}
{% block title %}Карта защит{% endblock %}
{% block content %}
<div class="map-page">
    <h1>Карта защит по городам</h1>
    <div class="map-controls">
        <div class="form-group">
            <label>Специальность:</label>
            <select id="specialty-filter">
                <option value="all">Все специальности</option>
            </select>
        </div>
    </div>
    <div id="map-container" style="position:relative;width:100%;margin-top:16px;background:#0d1b2a;border-radius:8px;overflow:hidden;"></div>
    <div class="map-legend" id="map-legend">
        <h3>Легенда</h3>
        <p>Размер точки = количество защит</p>
        <p>Цвет точки = специальность</p>
        <div id="legend-colors"></div>
    </div>
    <div class="map-stats" id="map-stats">
        <p>Всего городов: <span id="total-cities">0</span></p>
        <p>Всего защит: <span id="total-defenses">0</span></p>
    </div>
</div>
{% endblock %}

const LON_MIN=25,LON_MAX=190,LAT_MIN=40,LAT_MAX=83,SVG_W=1000,SVG_H=500;
function lngToX(lng){return((lng-LON_MIN)/(LON_MAX-LON_MIN))*SVG_W}
function latToY(lat){return SVG_H-((lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*SVG_H}

function getCityCoords(city){
    const l=city.toLowerCase().trim().replace(/\s*-\s*$/,'');
    if(cityCoords[l])return cityCoords[l];
    for(const[k,v]of Object.entries(cityCoords)){if(l.includes(k)||k.includes(l))return v}
    return[55.76,37.62];
}
function getSpecialtyColor(cipher){
    if(!cipher)return"#999";
    const p=cipher.split('.');
    const g=p.length>=2?p[0]+'.'+p[1]:p[0];
    return specialtyColors[g]||specialtyColors[p[0]]||"#999";
}
