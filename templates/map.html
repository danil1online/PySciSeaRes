{% extends "base.html" %}
{% block title %}Карта защит{% endblock %}
{% block content %}
<div class="map-page">
    <h1>Карта защит по городам</h1>

    <div class="map-controls">
        <div class="form-group">
            <label>Специальность:</label>
            <select id="specialty-filter">
                <option value="all">Все специальности</option>
            </select>
        </div>
    </div>

    <div id="map-container" style="position: relative; width: 100%; margin-top: 16px; background: #0d1b2a; border-radius: 8px; overflow: hidden;"></div>

    <div class="map-legend" id="map-legend">
        <h3>Легенда</h3>
        <p>Размер точки = количество защит</p>
        <p>Цвет точки = специальность</p>
        <div id="legend-colors"></div>
    </div>

    <div class="map-stats" id="map-stats">
        <p>Всего городов: <span id="total-cities">0</span></p>
        <p>Всего защит: <span id="total-defenses">0</span></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const cityStats = {{ city_stats | tojson }};
const cities = {{ cities | tojson }};
const specialtyGroups = {{ specialties | tojson }};

const specialtyColors = {
    "1": "#1f77b4", "1.1": "#1f77b4", "1.2": "#1f77b4", "1.3": "#1f77b4",
    "1.4": "#1f77b4", "1.5": "#1f77b4", "1.6": "#1f77b4",
    "2": "#ff7f0e", "2.1": "#ff7f0e", "2.2": "#ff7f0e", "2.3": "#ff7f0e",
    "2.4": "#ff7f0e", "2.5": "#ff7f0e", "2.6": "#ff7f0e", "2.7": "#ff7f0e",
    "2.8": "#ff7f0e", "2.9": "#ff7f0e", "2.10": "#ff7f0e",
    "3": "#2ca02c", "3.1": "#2ca02c", "3.2": "#2ca02c", "3.3": "#2ca02c", "3.4": "#2ca02c",
    "4": "#d62728", "4.1": "#d62728", "4.2": "#d62728", "4.3": "#d62728",
    "5": "#9467bd", "5.1": "#9467bd", "5.2": "#9467bd", "5.3": "#9467bd",
    "5.4": "#9467bd", "5.5": "#9467bd", "5.6": "#9467bd", "5.7": "#9467bd",
    "5.8": "#9467bd", "5.9": "#9467bd", "5.10": "#9467bd", "5.11": "#9467bd",
    "5.12": "#9467bd",
};

const cityCoords = {
    "москва": [55.7558, 37.6173], "москве": [55.7558, 37.6173],
    "санкт-петербург": [59.9343, 30.3351], "петербург": [59.9343, 30.3351],
    "спб": [59.9343, 30.3351], "новосибирск": [55.0084, 82.9357],
    "екатеринбург": [56.8389, 60.6057], "казань": [55.7961, 49.1064],
    "нижний новгород": [56.2965, 43.9361], "челябинск": [55.1644, 61.4368],
    "самара": [53.1959, 50.1002], "омск": [54.9885, 73.3242],
    "красноярск": [56.0153, 92.8932], "пермь": [58.0105, 56.2294],
    "воронеж": [51.6683, 39.1840], "ростов-на-дону": [47.2357, 39.7015],
    "уфа": [54.7388, 55.9721], "краснодар": [45.0355, 38.9753],
    "вологда": [59.2239, 39.8839], "тула": [54.1961, 37.6182],
    "калуга": [54.5293, 36.2754], "ярославль": [57.6261, 39.8845],
    "тверь": [56.8587, 35.9176], "иркутск": [52.2970, 104.2964],
    "томск": [56.5012, 84.9924], "белгород": [50.5997, 36.5881],
    "курск": [51.7372, 36.1874], "липецк": [52.6031, 39.5708],
    "тамбов": [52.7219, 41.4436], "владимир": [56.1290, 40.4071],
    "рязань": [54.6269, 39.6916], "пенза": [53.2001, 45.0049],
    "саратов": [51.5462, 46.0154], "волгоград": [48.7080, 44.5133],
    "брянск": [53.2521, 34.3717], "смоленск": [54.7826, 32.0453],
    "псков": [57.8194, 28.3318], "мурманск": [68.9585, 33.0827],
    "архангельск": [64.5401, 40.5433], "орел": [52.9651, 36.0785],
    "киров": [58.6035, 49.6680], "набережные челны": [55.7251, 52.4840],
    "ижевск": [56.8527, 53.2114], "череповец": [59.1369, 37.9069],
    "чепецк": [58.6656, 51.8434], "шуя": [56.3944, 41.6819],
    "родники": [57.1667, 42.0167], "суздаль": [56.4289, 40.4607],
    "кострома": [57.7675, 40.9289], "иваново": [56.9966, 40.9819],
    "мценск": [53.0456, 35.8944], "рославль": [53.2469, 32.8881],
    "ржев": [56.5906, 32.0879], "сарапул": [57.2136, 53.3727],
    "миасс": [55.0459, 60.1026], "салават": [54.3778, 55.9444],
    "нефтекамск": [56.0833, 55.2000], "краснокамск": [56.0500, 54.6833],
    "альметьевск": [54.9000, 52.4667], "нурлат": [54.9500, 51.7333],
    "златоуст": [54.9608, 59.9929], "чебоксары": [56.1322, 47.2489],
    "новокузнецк": [53.7596, 87.1216], "прокопьевск": [53.9817, 86.7108],
    "пионерский": [54.7333, 20.5000], "светлогорск": [54.7286, 20.4667],
    "апрелевка": [55.5000, 37.2833], "подольск": [55.4297, 37.5578],
    "клин": [56.3514, 37.0747], "чехов": [55.3100, 37.4100],
    "железнодорожный": [55.7969, 38.0378], "красногорск": [55.8300, 37.3297],
    "домодедово": [55.4311, 37.7956], "серпухов": [54.9219, 37.4106],
    "обнинск": [55.0969, 36.6056], "пушкино": [55.9219, 37.8931],
    "люберцы": [55.6889, 37.8939], "мытищи": [55.9106, 37.7369],
    "химки": [55.8969, 37.4297], "балашиха": [55.7964, 37.9378],
    "королёв": [55.9219, 37.8939], "электросталь": [55.7869, 38.4439],
    "реутов": [55.7597, 37.8650], "видное": [55.6500, 37.7500],
    "щелково": [55.9731, 38.2281], "фрязино": [56.0167, 38.3000],
    "жуковский": [55.7000, 38.1167], "новомосковск": [54.1000, 38.0333],
    "кашира": [55.3667, 38.3167], "сочи": [43.5855, 39.7231],
};

// Equirectangular projection → SVG coords
const LON_MIN = 25, LON_MAX = 190;
const LAT_MIN = 40, LAT_MAX = 83;
const SVG_W = 1000, SVG_H = 500;

function lngToX(lng) { return ((lng - LON_MIN) / (LON_MAX - LON_MIN)) * SVG_W; }
function latToY(lat) { return SVG_H - ((lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * SVG_H; }

function getCityCoords(city) {
    const lower = city.toLowerCase().trim();
    if (cityCoords[lower]) return cityCoords[lower];
    const clean = lower.replace(/^г\.\s*/, '').replace(/\s*-\s*$/, '');
    if (cityCoords[clean]) return cityCoords[clean];
    for (const [key, coords] of Object.entries(cityCoords)) {
        if (lower.includes(key) || key.includes(lower)) return coords;
    }
    return [55.7558, 37.6173];
}

function getSpecialtyColor(cipher) {
    if (!cipher) return "#999";
    const parts = cipher.split('.');
    const group = parts.length >= 2 ? parts[0] + '.' + parts[1] : parts[0];
    return specialtyColors[group] || specialtyColors[parts[0]] || "#999";
}

function renderMap() {
    const container = document.getElementById('map-container');
    container.innerHTML = '';

    if (!Array.isArray(cityStats) || cityStats.length === 0) {
        container.innerHTML = '<div style="padding: 60px 20px; text-align: center; color: #8ab;"><h2>Нет данных для отображения</h2><p>В БД нет записей с заполненным полем "city".</p><p>Запустите <code>python daily_sync.py</code> для обработки авторефератов.</p></div>';
        document.getElementById('total-cities').textContent = '0';
        document.getElementById('total-defenses').textContent = '0';
        return;
    }

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.style.width = '100%';
    svg.style.height = 'auto';
    svg.style.display = 'block';

    // Background
    const bg = document.createElementNS(ns, 'rect');
    bg.setAttribute('width', SVG_W);
    bg.setAttribute('height', SVG_H);
    bg.setAttribute('fill', '#0d1b2a');
    svg.appendChild(bg);

    // Russia outline — equirectangular projection
    const russiaPath = 'M 30,163 L 61,151 L 91,140 L 121,128 L 152,116 L 212,105 ' +
        'L 273,93 L 333,81 L 394,70 L 455,58 L 515,58 L 576,47 L 636,47 L 697,58 ' +
        'L 758,70 L 818,81 L 879,105 L 939,128 L 1000,151 L 1000,209 L 970,267 ' +
        'L 939,326 L 909,360 L 879,384 L 848,407 L 818,430 L 788,442 L 727,442 ' +
        'L 667,430 L 636,407 L 667,384 L 697,360 L 727,326 L 818,291 L 848,326 ' +
        'L 879,360 L 697,326 L 636,349 L 576,360 L 515,360 L 455,360 L 394,360 ' +
        'L 333,360 L 273,360 L 242,349 L 212,337 L 182,337 L 152,349 L 121,360 ' +
        'L 91,384 L 73,419 L 61,430 L 42,407 L 30,384 L 18,360 L 12,326 L 18,291 ' +
        'L 30,267 L 18,244 L 12,221 L 18,198 L 30,174 Z';

    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', russiaPath);
    path.setAttribute('fill', '#1b2838');
    path.setAttribute('stroke', '#3a5a7a');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);

    // Grid lines
    const gridOpacity = '0.12';
    for (let lon = 30; lon <= 180; lon += 30) {
        const x = lngToX(lon);
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', x); line.setAttribute('y1', 0);
        line.setAttribute('x2', x); line.setAttribute('y2', SVG_H);
        line.setAttribute('stroke', '#4a7a9a');
        line.setAttribute('stroke-width', '0.5');
        line.setAttribute('opacity', gridOpacity);
        svg.appendChild(line);
    }
    for (let lat = 45; lat <= 80; lat += 10) {
        const y = latToY(lat);
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', 0); line.setAttribute('y1', y);
        line.setAttribute('x2', SVG_W); line.setAttribute('y2', y);
        line.setAttribute('stroke', '#4a7a9a');
        line.setAttribute('stroke-width', '0.5');
        line.setAttribute('opacity', gridOpacity);
        svg.appendChild(line);
    }

    // Latitude labels
    for (let lat = 45; lat <= 80; lat += 10) {
        const y = latToY(lat);
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', 4);
        text.setAttribute('y', y - 3);
        text.setAttribute('fill', '#4a7a9a');
        text.setAttribute('font-size', '10');
        text.setAttribute('opacity', '0.5');
        text.textContent = lat + '°';
        svg.appendChild(text);
    }

    // Longitude labels
    for (let lon = 30; lon <= 180; lon += 30) {
        const x = lngToX(lon);
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', SVG_H - 5);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#4a7a9a');
        text.setAttribute('font-size', '10');
        text.setAttribute('opacity', '0.5');
        text.textContent = lon + '°';
        svg.appendChild(text);
    }

    // Markers
    const specialtyFilter = document.getElementById('specialty-filter').value;
    const filteredStats = cityStats.filter(s => {
        if (specialtyFilter !== 'all') {
            return s.specialties[specialtyFilter] > 0;
        }
        return true;
    });

    let markerCount = 0;
    const usedColors = new Set();

    filteredStats.forEach(stat => {
        const coords = getCityCoords(stat.city);
        if (!coords) return;
        const x = lngToX(coords[1]);
        const y = latToY(coords[0]);
        if (x < 10 || x > SVG_W - 10 || y < 10 || y > SVG_H - 10) return;

        const radius = Math.max(4, Math.min(20, Math.sqrt(stat.count) * 3));
        const primarySpecialty = Object.entries(stat.specialties)
            .sort((a, b) => b[1] - a[1])[0];
        const color = getSpecialtyColor(primarySpecialty[0]);
        usedColors.add(color);

        const g = document.createElementNS(ns, 'g');
        g.style.cursor = 'pointer';

        // Glow
        const glow = document.createElementNS(ns, 'circle');
        glow.setAttribute('cx', x); glow.setAttribute('cy', y);
        glow.setAttribute('r', radius + 3);
        glow.setAttribute('fill', color);
        glow.setAttribute('opacity', '0.2');
        g.appendChild(glow);

        // Main dot
        const circle = document.createElementNS(ns, 'circle');
        circle.setAttribute('cx', x); circle.setAttribute('cy', y);
        circle.setAttribute('r', radius);
        circle.setAttribute('fill', color);
        circle.setAttribute('stroke', '#fff');
        circle.setAttribute('stroke-width', '1.5');
        circle.setAttribute('opacity', '0.85');
        g.appendChild(circle);

        // Title tooltip
        const title = document.createElementNS(ns, 'title');
        title.textContent = `${stat.city} — ${stat.count} защит`;
        g.appendChild(title);

        // Label for big markers
        if (radius >= 8) {
            const label = document.createElementNS(ns, 'text');
            label.setAttribute('x', x);
            label.setAttribute('y', y - radius - 6);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('fill', '#e0e0e0');
            label.setAttribute('font-size', '10');
            label.setAttribute('font-weight', 'bold');
            label.style.pointerEvents = 'none';
            label.textContent = stat.city;
            g.appendChild(label);
        }

        // Click → detail page
        g.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = `/detail/${encodeURIComponent(stat.city)}`;
            link.target = '_blank';
            link.click();
        });

        svg.appendChild(g);
        markerCount++;
    });

    container.appendChild(svg);
    document.getElementById('total-cities').textContent = filteredStats.length;
    document.getElementById('total-defenses').textContent = filteredStats.reduce((sum, s) => sum + s.count, 0);

    const legendHtml = Array.from(usedColors).map(color =>
        `<div style="display: flex; align-items: center; gap: 8px; margin: 4px 0;">
            <div style="width: 16px; height: 16px; border-radius: 50%; background: ${color}; border: 1px solid #333;"></div>
            <span>Специальность</span>
        </div>`
    ).join('');
    document.getElementById('legend-colors').innerHTML = legendHtml;
}

document.getElementById('specialty-filter').addEventListener('change', renderMap);

const specialtyFilter = document.getElementById('specialty-filter');
specialtyGroups.forEach(group => {
    if (group.specialties) {
        group.specialties.forEach(spec => {
            const option = document.createElement('option');
            option.value = spec.cipher;
            option.textContent = `${spec.cipher} — ${spec.name}`;
            specialtyFilter.appendChild(option);
        });
    }
});

renderMap();
</script>
<style>
.map-page { max-width: 1200px; margin: 0 auto; }
.map-controls { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.map-controls .form-group { flex: 1; min-width: 200px; }
.map-controls select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
.map-legend { margin-top: 16px; padding: 16px; background: #f8f9fa; border-radius: 8px; }
.map-legend h3 { margin-top: 0; }
.map-stats { margin-top: 16px; display: flex; gap: 32px; }
.map-stats span { font-weight: bold; }
</style>
{% endblock %}
