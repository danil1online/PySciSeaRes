{% extends "base.html" %}
{% block title %}Карта защит{% endblock %}
{% block content %}
<div class="map-page">
    <h1>Карта защит по городам</h1>
    <div class="map-controls">
        <div class="form-group">
            <label>Специальность:</label>
            <select id="specialty-filter">
                <option value="all">Все специальности</option>
            </select>
        </div>
    </div>
    <div id="map-plotly" style="width:100%;height:600px;margin-top:16px;"></div>
    <div class="map-stats" id="map-stats">
        <p>Всего городов: <span id="total-cities">0</span></p>
        <p>Всего защит: <span id="total-defenses">0</span></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js" crossorigin="anonymous"></script>
<script>
const cityStats = {{ city_stats | tojson }};
const specialties = {{ specialties | tojson }};

const specialtyColors = {
    "1":"#1f77b4","1.1":"#1f77b4","1.2":"#1f77b4","1.3":"#1f77b4","1.4":"#1f77b4","1.5":"#1f77b4","1.6":"#1f77b4",
    "2":"#ff7f0e","2.1":"#ff7f0e","2.2":"#ff7f0e","2.3":"#ff7f0e","2.4":"#ff7f0e","2.5":"#ff7f0e","2.6":"#ff7f0e","2.7":"#ff7f0e","2.8":"#ff7f0e","2.9":"#ff7f0e","2.10":"#ff7f0e",
    "3":"#2ca02c","3.1":"#2ca02c","3.2":"#2ca02c","3.3":"#2ca02c","3.4":"#2ca02c",
    "4":"#d62728","4.1":"#d62728","4.2":"#d62728","4.3":"#d62728",
    "5":"#9467bd","5.1":"#9467bd","5.2":"#9467bd","5.3":"#9467bd","5.4":"#9467bd","5.5":"#9467bd","5.6":"#9467bd","5.7":"#9467bd","5.8":"#9467bd","5.9":"#9467bd","5.10":"#9467bd","5.11":"#9467bd","5.12":"#9467bd",
};

// Pre-computed city coordinates in EPSG:32646 (x, y) from pyproj EPSG:4326->32646
const cityCoordsEPSG32646 = {
    "москва": [-2702979, 7640472],
    "санкт-петербург": [-2558308, 8337643],
    "новосибирск": [-142518, 6142155],
    "екатеринбург": [-1429336, 6776250],
    "казань": [-2129577, 7087828],
    "нижний новгород": [-2354627, 7365407],
    "челябинск": [-1470854, 6578025],
    "самара": [-2266451, 6795008],
    "омск": [-750115, 6272233],
    "красноярск": [493342, 6207788],
    "пермь": [-1599116, 7033275],
    "воронеж": [-3014280, 7208707],
    "ростов-на-дону": [-3398328, 6774307],
    "уфа": [-1818116, 6714777],
    "краснодар": [-3652984, 6611362],
    "вологда": [-2278522, 7804115],
    "тула": [-2853522, 7513557],
    "калуга": [-2884445, 7617328],
    "ярославль": [-2425531, 7674623],
    "тверь": [-2669347, 7819474],
    "иркутск": [1269078, 5854399],
    "томск": [7697, 6290627],
    "белгород": [-3258805, 7274213],
    "курск": [-3166648, 7395159],
    "липецк": [-2906039, 7267991],
    "тамбов": [-2794890, 7174467],
    "владимир": [-2539117, 7524222],
    "рязань": [-2711740, 7434967],
    "пенза": [-2557945, 7033015],
    "саратов": [-2634391, 6826800],
    "волгоград": [-2959006, 6631675],
    "брянск": [-3102389, 7629976],
    "смоленск": [-3045230, 7888924],
    "псков": [-2853565, 8317567],
    "мурманск": [-1554451, 8779968],
    "архангельск": [-1769843, 8192841],
    "орел": [-3049460, 7502867],
    "киров": [-1890374, 7327953],
    "набережные челны": [-1951574, 6943632],
    "ижевск": [-1834875, 7025939],
    "череповец": [-2366669, 7892229],
    "сочи": [-3735892, 6418253],
    "донецк": [-3443918, 6967861],
};

let allTraces = [];

function loadMapData() {
    fetch('/data/russia_regions_transformed.json')
        .then(r => r.json())
        .then(regionsData => {
            const regionTraces = [];
            for (const feat of regionsData.features) {
                const coords = feat.geometry.coordinates;
                const name = feat.properties.region;

                // coords are now in EPSG:32646 (x, y) format from pyproj transformation
                for (const polygon of coords) {
                    let xArr = [], yArr = [];
                    for (const ring of polygon) {
                        for (const [x, y] of ring) {
                            xArr.push(x);
                            yArr.push(y);
                        }
                        xArr.push(null);
                        yArr.push(null);
                    }
                    regionTraces.push({
                        type: 'scatter',
                        x: xArr,
                        y: yArr,
                        mode: 'lines',
                        line: { color: 'grey', width: 0.5 },
                        fill: 'toself',
                        fillcolor: 'rgba(200, 220, 255, 0.15)',
                        name: name,
                        text: name,
                        hoverinfo: 'text',
                        showlegend: false
                    });
                }
            }
            allTraces = regionTraces;
            drawMap();
        })
        .catch(err => {
            console.error('Error loading regions:', err);
            drawMap();
        });
}

function drawMap() {
    const filter = document.getElementById('specialty-filter').value;

    const cityTrace = {
        type: 'scatter',
        mode: 'markers',
        x: [],
        y: [],
        text: [],
        hoverinfo: 'text',
        marker: {
            size: [],
            color: [],
            line: { color: 'white', width: 1 }
        },
        showlegend: false,
        name: 'cities'
    };

    let maxCount = 0;
    Object.values(cityStats).forEach(s => { if (s.count > maxCount) maxCount = s.count; });

    for (const [name, data] of Object.entries(cityStats)) {
        if (filter !== 'all' && data.specialty !== filter) continue;

        const coords = cityCoordsEPSG32646[name.toLowerCase()];
        if (!coords) continue;

        const [x, y] = coords;
        const radius = Math.max(6, Math.sqrt(data.count / maxCount) * 25);
        const color = specialtyColors[data.specialty] || '#888';

        cityTrace.x.push(x);
        cityTrace.y.push(y);
        cityTrace.text.push(`${name}: ${data.count} защит (спец. ${data.specialty})`);
        cityTrace.marker.size.push(radius);
        cityTrace.marker.color.push(color);
    }

    const traces = [...allTraces];
    if (cityTrace.x.length > 0) {
        traces.push(cityTrace);
    }

    const layout = {
        dragmode: 'pan',
        height: 600,
        margin: { l: 10, b: 10, t: 10, r: 10 },
        showlegend: false,
        xaxis: { visible: false },
        yaxis: { visible: false },
        paper_bgcolor: '#0a1628',
        plot_bgcolor: '#0a1628'
    };

    Plotly.newPlot('map-plotly', traces, layout, { responsive: true });
}

document.getElementById('specialty-filter').addEventListener('change', () => {
    drawMap();
});

const allSpecialties = [...new Set(Object.values(cityStats).map(s => s.specialty))].sort();
allSpecialties.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    document.getElementById('specialty-filter').appendChild(opt);
});

const cities = Object.keys(cityStats).length;
const defenses = Object.values(cityStats).reduce((sum, s) => sum + s.count, 0);
document.getElementById('total-cities').textContent = cities;
document.getElementById('total-defenses').textContent = defenses;

loadMapData();
</script>
{% endblock %}
